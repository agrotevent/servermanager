{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
  <h1><span class="spinner"></span> {{ title }}</h1>
  <p>{{ message }}</p>
  <div id="restart-wait" data-next="{{ next_url or url_for('auth.login') }}" {% if next_url %}data-log="{{ url_for('admin.update_log') }}"{% endif %}></div>
  {% if next_url %}<pre class="log" id="update-log" style="min-height:120px"></pre>{% endif %}
</div></div>
{% endblock %}
